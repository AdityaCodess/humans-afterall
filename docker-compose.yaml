services:
  # -------------------------------------------------------------
  # 1. The Frontend Client (Next.js / Three.js)
  # -------------------------------------------------------------
  client:
    image: node:22-alpine
    working_dir: /app
    # In dev, we mount the volume and run the dev server
    command: sh -c "npm install && npm run dev"
    ports:
      - "5000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api-gateway
    volumes:
      - ./client:/app
      - /app/node_modules

  # -------------------------------------------------------------
  # 2. The REST API Gateway (Node.js / Express)
  # -------------------------------------------------------------
  api-gateway:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npx tsx src/index.ts && npm run dev"
    ports:
      - "4000:4000"
    dns:
      - 8.8.8.8
    env_file:
      - ./api-gateway/.env
    environment:
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://admin:secret@postgres:5432/humans_world
    depends_on:
      - redis
      - postgres
    volumes:
      - ./api-gateway:/app
      - /app/node_modules

  # -------------------------------------------------------------
  # 3. The Statistical Macro-Engine (Python / FastAPI)
  # -------------------------------------------------------------
  macro-sim:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:secret@postgres:5432/humans_world
    depends_on:
      - postgres
    volumes:
      - ./macro-sim:/app

  # -------------------------------------------------------------
  # 4. The High-Fidelity Spatial Engine (Rust)
  # -------------------------------------------------------------
  spatial-engine:
    image: rust:latest
    working_dir: /app
    command: cargo run
    ports:
      - "9000:9000/udp" # WebRTC DataChannels / UDP traffic
      - "9001:9001/tcp" 
      - "8088:8080"
    environment:
      - REDIS_URL=redis://redis:6379
      - CARGO_TARGET_DIR=/tmp/target
    depends_on:
      - redis
    volumes:
      - ./spatial-engine:/app
      - cargo_cache:/usr/local/cargo/registry
      - ./spatial-engine:/app
  # -------------------------------------------------------------
  # 5. Permanent History Ledger (PostgreSQL)
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: humans_world
    volumes:
      - pg_data:/var/lib/postgresql/data

  # -------------------------------------------------------------
  # 6. Active World State (Redis)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
  cargo_cache:
