[package]
name = "spatial-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
warp = "0.3"
serde = { version = "1.0", features = { version = "1.0", features = ["derive"] } }
serde_json = "1.0"
futures-util = "0.3"
redis = { version = "0.24", features = ["tokio-comp", "aio"] }